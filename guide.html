<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MASARU · คู่มือการใช้งานระบบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#1A2942; --navy-2:#22345A; --blue:#3A5A8C; --gold:#D0212B;
    --green:#1E7145; --red:#D0212B; --amber:#B7791F;
    --bg:#EEF2F8; --card:#fff; --line:#E2E8F0; --ink:#1A202C; --muted:#64748B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;min-height:100vh}
  button{font-family:inherit;cursor:pointer}
  .hide{display:none!important}
  .boot{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted)}

  /* ===== แถบหัว ===== */
  header.top{background:var(--navy);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;
    flex-wrap:wrap;border-bottom:4px solid var(--gold);position:sticky;top:0;z-index:50}
  header.top .ttl{font-weight:700;font-size:17px;display:flex;align-items:center;gap:9px}
  header.top .sp{flex:1}
  .h-btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:9px;
    padding:8px 14px;font-size:13px;font-weight:600;text-decoration:none;display:inline-block;white-space:nowrap}
  .h-btn:hover{background:rgba(255,255,255,.26)}
  .h-search{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);color:#fff;border-radius:9px;
    padding:8px 13px;font-size:14px;width:240px;outline:none;font-family:inherit}
  .h-search::placeholder{color:#B6C4DC}
  .role-pill{background:rgba(255,255,255,.14);padding:5px 13px;border-radius:20px;font-size:12.5px;font-weight:600}
  @media(max-width:860px){
    header.top{padding:10px 13px;gap:8px}
    header.top .ttl{font-size:15px}
    .role-pill,#printBtn{display:none}
    .h-search{order:5;flex:0 0 100%;width:100%}
  }

  /* แถบข้ามหัวข้อ (เฉพาะมือถือ — เมนูข้างถูกซ่อน) */
  .jump{display:none;gap:7px;overflow-x:auto;padding:0 0 14px;-webkit-overflow-scrolling:touch}
  .jump a{flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:7px 13px;
    font-size:12.8px;font-weight:600;color:var(--navy);text-decoration:none;white-space:nowrap}
  .jump a.on{background:var(--navy);border-color:var(--navy);color:#fff}
  @media(max-width:860px){ .jump{display:flex} }
  @media print{ .jump{display:none!important} }

  /* ===== โครงหน้า ===== */
  .wrap{display:flex;align-items:flex-start;max-width:1500px;margin:0 auto}
  nav.side{width:272px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);
    padding:14px 0 40px;position:sticky;top:61px;height:calc(100vh - 61px);overflow-y:auto}
  nav.side .grp{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.6px;padding:13px 18px 6px}
  nav.side a{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:14px;color:var(--ink);
    text-decoration:none;border-left:3px solid transparent;line-height:1.35}
  nav.side a:hover{background:#F1F5F9}
  nav.side a.on{background:#FEF2F2;border-left-color:var(--gold);color:var(--navy);font-weight:700}
  nav.side a .ic{font-size:17px;flex-shrink:0}
  main{flex:1;min-width:0;padding:24px 28px 80px}
  @media(max-width:860px){ nav.side{display:none} main{padding:16px 14px 60px} }

  /* ===== เนื้อหา ===== */
  .sec{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px 26px;margin-bottom:22px;
    scroll-margin-top:76px}
  .sec.hide-search{display:none}
  @media(max-width:860px){ .sec{padding:18px 16px} }
  .sec-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:6px;flex-wrap:wrap}
  .sec-ic{font-size:34px;line-height:1}
  .sec-nm{font-size:20px;font-weight:700;color:var(--navy)}
  .sec-sub{font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.55}
  .sec-open{margin-left:auto;background:var(--navy);color:#fff;border-radius:9px;padding:8px 15px;
    font-size:13px;font-weight:700;white-space:nowrap;text-decoration:none;display:inline-block}
  .sec-open:hover{background:var(--navy-2)}

  .h{font-size:14px;font-weight:700;color:var(--navy);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
  .h::before{content:'';width:4px;height:15px;background:var(--gold);border-radius:3px}

  .flowwrap{overflow-x:auto;background:#F8FAFC;border:1px solid var(--line);border-radius:12px;padding:6px;
    -webkit-overflow-scrolling:touch}
  .flow{width:100%;height:auto;display:block}
  .flowhint{display:none;font-size:11.5px;color:var(--muted);margin-top:4px}
  @media(max-width:860px){ .flow{width:640px} .flowhint{display:block} }

  .prep{display:flex;flex-wrap:wrap;gap:9px}
  .prep .p{background:#F8FAFC;border:1px solid var(--line);border-radius:10px;padding:9px 13px;
    font-size:13.2px;line-height:1.5;max-width:100%}
  .prep .p b{color:var(--navy)}
  .prep .p .req{color:var(--red);font-weight:700;font-size:11.5px}
  .prep .p .opt{color:var(--muted);font-weight:700;font-size:11.5px}

  ol.steps{list-style:none;counter-reset:s;padding:0;margin:0}
  ol.steps > li{counter-increment:s;position:relative;padding:0 0 18px 44px;border-left:2px dashed var(--line);margin-left:15px}
  ol.steps > li:last-child{border-left-color:transparent;padding-bottom:2px}
  ol.steps > li::before{content:counter(s);position:absolute;left:-16px;top:-2px;width:30px;height:30px;border-radius:50%;
    background:var(--navy);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
  ol.steps .st{font-weight:700;color:var(--ink);font-size:14.5px;margin-bottom:4px}
  ol.steps .sd{font-size:13.5px;color:var(--muted);line-height:1.68}
  ol.steps .sd b{color:var(--ink)}

  /* จำลองหน้าตาปุ่ม/ช่องในระบบจริง */
  .ui-mock{margin-top:9px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .ui-drop{width:100%;border:2px dashed #CBD5E1;border-radius:11px;background:#FFFDF3;padding:14px;text-align:center}
  .ui-drop .di{font-size:22px}
  .ui-drop .dt{font-weight:700;font-size:13.5px;margin-top:3px;color:var(--ink)}
  .ui-drop .ds{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5}
  .ui-btn{border-radius:8px;padding:6px 13px;font-size:12.8px;font-weight:700;display:inline-block;
    background:#EEF1F6;color:var(--ink);border:1px solid var(--line)}
  .ui-btn.dark{background:#161616;color:#FFD400;border-color:#161616}
  .ui-btn.gold{background:#FFD400;color:#161616;border-color:#E9C200}
  .ui-btn.navy{background:var(--navy);color:#fff;border-color:var(--navy)}
  .ui-tabs{display:flex;gap:4px;flex-wrap:wrap;background:#F1F5F9;border-radius:10px;padding:4px}
  .ui-tabs span{padding:6px 12px;border-radius:7px;font-size:12.8px;font-weight:600;color:var(--muted)}
  .ui-tabs span.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.09)}
  .ui-fld{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);
    border-radius:8px;padding:5px 11px;font-size:12.8px;color:var(--muted)}
  .ui-chip{background:#EEF4FB;border:1px solid #CFE0F2;border-radius:20px;padding:4px 11px;font-size:12.3px;
    color:var(--navy);font-weight:600}

  .outs{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px}
  .outs .o{background:#F2FBF5;border:1px solid #BFE6CB;border-radius:11px;padding:11px 14px;font-size:13.2px;line-height:1.55}
  .outs .o b{color:#166534;display:block;margin-bottom:2px}

  .note{border-radius:11px;padding:12px 15px;font-size:13.2px;line-height:1.7;margin-top:9px}
  .note.tip{background:#EEF4FB;border:1px solid #CFE0F2}
  .note.warn{background:#FFF7E6;border:1px solid #F0D79A}
  .note b{color:var(--navy)}
  .note ul{margin:4px 0 0 18px;padding:0}
  .note li{margin:3px 0}

  .faq{border-bottom:1px solid var(--line);padding:12px 0}
  .faq:last-child{border-bottom:none;padding-bottom:0}
  .faq .q{font-weight:700;color:var(--navy);font-size:14px;cursor:pointer;display:flex;gap:9px;align-items:flex-start}
  .faq .q::before{content:'▸';color:var(--gold);flex-shrink:0;transition:.15s}
  .faq.open .q::before{transform:rotate(90deg)}
  .faq .a{font-size:13.4px;color:var(--muted);line-height:1.75;padding:8px 0 0 19px;display:none}
  .faq.open .a{display:block}
  .empty{text-align:center;color:var(--muted);padding:50px;background:#fff;border:1px dashed var(--line);border-radius:14px}

  @media print{
    header.top, nav.side, .sec-open{display:none!important}
    body{background:#fff}
    main{padding:0}
    .sec{break-inside:avoid;page-break-inside:avoid;border-radius:0;border:none;border-bottom:1px solid #ddd;margin-bottom:12px}
  }
</style>
</head>
<body>

<div id="pageWrap" class="hide">
<header class="top">
  <span class="ttl">📖 คู่มือการใช้งานระบบ</span>
  <div class="sp"></div>
  <input class="h-search" id="searchBox" type="search" placeholder="🔎 ค้นหาในคู่มือ...">
  <span class="role-pill" id="rolePill">—</span>
  <button class="h-btn" id="printBtn">🖨️ พิมพ์คู่มือ</button>
  <a class="h-btn" href="index.html">← กลับหน้าหลัก</a>
</header>

<div class="wrap">
  <nav class="side" id="navSide"></nav>
  <main><div class="jump" id="jumpBar"></div><div id="mainBox"></div></main>
</div>
</div>

/* ── ภาพประกอบ: ผังการทำงาน input → ระบบ → output ── */
let __flowSeq = 0;
function gdFlow(f){
  if(!f) return '';
  const IN=f.in||[], OUT=f.out||[], MID=f.mid||{i:'⚙️',t:'ระบบ'};
  const bw=196, bh=50, gap=11, mw=150, mh=74;
  const rows=Math.max(IN.length,OUT.length,1);
  const H=Math.max(rows*(bh+gap)-gap, mh)+34;
  const cy=H/2, W=700, xIn=10, xMid=258, xOut=498;
  const yAt=(n,i)=>cy-(n*(bh+gap)-gap)/2+i*(bh+gap);
  const id='ar'+(++__flowSeq);
  const e=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let s=`<svg class="flow" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="ผังการทำงาน">`;
  s+=`<defs><marker id="${id}" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">`
   + `<path d="M0,0 L9,4.5 L0,9 z" fill="#94A3B8"/></marker></defs>`;
  const box=(x,y,w,h,fill,stroke,ic,t,tc)=>
      `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${fill}" stroke="${stroke}"/>`
    + `<text x="${x+15}" y="${y+h/2+6}" font-size="17">${ic}</text>`
    + `<text x="${x+38}" y="${y+h/2+5}" font-size="12.5" font-weight="600" fill="${tc}">${e(t)}</text>`;
  IN.forEach((n,i)=>{ const y=yAt(IN.length,i);
    s+=box(xIn,y,bw,bh,'#FFFDF3','#E4D9A8',n.i,n.t,'#1A202C');
    s+=`<path d="M${xIn+bw} ${y+bh/2} C${xIn+bw+26} ${y+bh/2}, ${xMid-26} ${cy}, ${xMid-4} ${cy}" `
      +`fill="none" stroke="#CBD5E1" stroke-width="1.6" marker-end="url(#${id})"/>`; });
  s+=`<rect x="${xMid}" y="${cy-mh/2}" width="${mw}" height="${mh}" rx="10" fill="#1A2942"/>`
   + `<text x="${xMid+mw/2}" y="${cy-8}" font-size="26" text-anchor="middle">${MID.i}</text>`
   + `<text x="${xMid+mw/2}" y="${cy+22}" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">${e(MID.t)}</text>`;
  OUT.forEach((n,i)=>{ const y=yAt(OUT.length,i);
    s+=`<path d="M${xMid+mw+4} ${cy} C${xMid+mw+26} ${cy}, ${xOut-26} ${y+bh/2}, ${xOut-4} ${y+bh/2}" `
      +`fill="none" stroke="#CBD5E1" stroke-width="1.6" marker-end="url(#${id})"/>`;
    s+=box(xOut,y,bw,bh,'#F2FBF5','#BFE6CB',n.i,n.t,'#14532D'); });
  return s+'</svg>';
}

/* ── ภาพจำลองหน้าตาปุ่ม/ช่องในระบบจริง ── */
function gdUI(u){
  if(!u) return '';
  const e=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  if(u.type==='drop')
    return `<div class="ui-mock"><div class="ui-drop"><div class="di">${u.ic||'📥'}</div>`
         + `<div class="dt">${e(u.t||'')}</div><div class="ds">${e(u.s||'')}</div></div></div>`;
  if(u.type==='btn')
    return `<div class="ui-mock">${u.items.map(b=>`<span class="ui-btn ${b[1]||''}">${e(b[0])}</span>`).join('')}</div>`;
  if(u.type==='tabs')
    return `<div class="ui-mock"><div class="ui-tabs">${u.items.map(t=>`<span class="${t[1]?'on':''}">${e(t[0])}</span>`).join('')}</div></div>`;
  if(u.type==='fld')
    return `<div class="ui-mock">${u.items.map(t=>`<span class="ui-fld">${e(t)}</span>`).join('')}</div>`;
  if(u.type==='chip')
    return `<div class="ui-mock">${u.items.map(t=>`<span class="ui-chip">${e(t)}</span>`).join('')}</div>`;
  return '';
}

function gdSection(g){
  const e=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let h=`<section class="sec" id="s-${g.k}" data-k="${g.k}">
    <div class="sec-head">
      <div class="sec-ic">${g.icon}</div>
      <div style="flex:1;min-width:180px">
        <div class="sec-nm">${e(g.name)}</div>
        <div class="sec-sub">${g.sub||''}</div>
      </div>
      ${g.url?`<a class="sec-open" href="${g.url}">เปิดระบบนี้ →</a>`:''}
    </div>`;
  if(g.faq)
    return h+`<div style="margin-top:14px">`+g.faq.map(f=>
      `<div class="faq"><div class="q">${f.q}</div><div class="a">${f.a}</div></div>`).join('')+`</div></section>`;

  if(g.flow) h+=`<div class="h">ภาพรวมการทำงาน</div><div class="flowwrap">`+gdFlow(g.flow)
             +`</div><div class="flowhint">เลื่อนนิ้วดูผังทางแนวนอนได้</div>`;
  if(g.prep && g.prep.length)
    h+=`<div class="h">ไฟล์ที่ต้องเตรียม</div><div class="prep">`
     + g.prep.map(p=>`<div class="p"><b>${e(p.n)}</b> `
       + (p.r?`<span class="req">จำเป็น</span>`:`<span class="opt">ใส่หรือไม่ก็ได้</span>`)
       + `<br>${e(p.d)}</div>`).join('')+`</div>`;
  if(g.steps && g.steps.length)
    h+=`<div class="h">ขั้นตอนการใช้งาน</div><ol class="steps">`
     + g.steps.map(s=>`<li><div class="st">${s.t}</div><div class="sd">${s.d}</div>${gdUI(s.ui)}</li>`).join('')+`</ol>`;
  if(g.out && g.out.length)
    h+=`<div class="h">สิ่งที่จะได้</div><div class="outs">`
     + g.out.map(o=>`<div class="o"><b>${e(o.n)}</b>${e(o.d)}</div>`).join('')+`</div>`;
  if(g.tip && g.tip.length)
    h+=`<div class="note tip"><b>💡 เคล็ดลับ</b><ul>${g.tip.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
  if(g.warn && g.warn.length)
    h+=`<div class="note warn"><b>⚠️ ข้อควรระวัง</b><ul>${g.warn.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
  return h+`</section>`;
}

let gdList=[];
function gdBuild(role){
  gdList = GUIDE.filter(g => g.roles==='*' || (g.roles||[]).includes(role));
  if(!gdList.length) gdList = GUIDE.filter(g=>g.roles==='*');
  const grps=[...new Set(gdList.map(g=>g.grp))];
  $('navSide').innerHTML = grps.map(gr=>
      `<div class="grp">${gr}</div>`
    + gdList.filter(g=>g.grp===gr).map(g=>
        `<a href="#s-${g.k}" data-k="${g.k}"><span class="ic">${g.icon}</span><span>${g.name}</span></a>`).join('')).join('');
  $('mainBox').innerHTML = gdList.map(gdSection).join('')
    + `<div class="empty hide" id="emptyBox">ไม่พบหัวข้อที่ค้นหา — ลองใช้คำสั้นลง</div>`;
  $('jumpBar').innerHTML = gdList.map(g=>
      `<a href="#s-${g.k}" data-k="${g.k}">${g.icon} ${g.name}</a>`).join('');
  document.querySelectorAll('nav.side a, .jump a').forEach(a=> a.onclick=ev=>{
    ev.preventDefault();
    const t=document.getElementById('s-'+a.dataset.k);
    if(t) window.scrollTo({ top:t.offsetTop-70, behavior:'smooth' });
    gdMark(a.dataset.k);
  });
  $('mainBox').querySelectorAll('.faq .q').forEach(q=> q.onclick=()=> q.parentElement.classList.toggle('open'));
  gdMark(gdList[0] && gdList[0].k);
}
function gdMark(k){ document.querySelectorAll('nav.side a, .jump a').forEach(a=> a.classList.toggle('on', a.dataset.k===k)); }

function gdSearch(q){
  q=(q||'').trim().toLowerCase(); let shown=0;
  $('mainBox').querySelectorAll('.sec').forEach(sec=>{
    const hit = !q || sec.textContent.toLowerCase().includes(q);
    sec.classList.toggle('hide-search', !hit); if(hit) shown++;
  });
  const emp=$('emptyBox'); if(emp) emp.classList.toggle('hide', shown>0);
  document.querySelectorAll('nav.side a, .jump a').forEach(a=>{
    const sec=document.getElementById('s-'+a.dataset.k);
    a.style.display = (sec && sec.classList.contains('hide-search')) ? 'none' : '';
  });
}

$('searchBox').oninput = e=> gdSearch(e.target.value);
$('printBtn').onclick  = ()=>{ $('searchBox').value=''; gdSearch(''); setTimeout(()=>window.print(),120); };
window.addEventListener('scroll', ()=>{
  const top=window.scrollY+90; let cur=null;
  $('mainBox').querySelectorAll('.sec').forEach(s=>{ if(s.offsetTop<=top && !s.classList.contains('hide-search')) cur=s.dataset.k; });
  if(cur) gdMark(cur);
});

/* ===== ตรวจสิทธิ์ แล้วสร้างคู่มือตามฝ่าย ===== */
sb.auth.onAuthStateChange((e,s)=>{ if(e==='SIGNED_OUT'||!s) location.replace('index.html'); });
(async function(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ location.replace('index.html'); return; }
  const role = (session.user.user_metadata && session.user.user_metadata.role) || '';
  $('rolePill').textContent = 'ฝ่าย: ' + (ROLE_LABEL[role] || role || '—');
  gdBuild(role);
  $('bootScreen').classList.add('hide');
  $('pageWrap').classList.remove('hide');
})();
</script>
